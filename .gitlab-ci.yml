stages:
  - verify
  - security
  - license
  - release

default:
  image: node:20-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
        - mcp-server/package-lock.json
    paths:
      - node_modules/
      - mcp-server/node_modules/
  before_script:
    - node --version
    - npm --version

verify:
  stage: verify
  timeout: 30m
  script:
    - npm ci
    - (cd mcp-server && npm ci)
    - npm run typecheck
    - npm run build
    - npm run docs:build
    - npm run lint
    - npm test
    - (cd mcp-server && npm test)
    - (cd mcp-server && npm run check:docs)

dependency-audit:
  stage: security
  timeout: 15m
  # npm audit 的 registry 端点在 CI 网络偶发不可达（audit endpoint returned an error）。
  # 每个目录独立重试 3 次；审计一旦成功执行以结果为准（有 critical 才失败）；
  # 连续网络失败则警告放行。registry 不可达 ≠ 漏洞。
  cache: []
  script:
    - npm ci --ignore-scripts
    - for i in 1 2 3; do npm audit --audit-level=critical > audit-root.txt 2>&1 && break; grep -q "audit endpoint returned an error" audit-root.txt || { cat audit-root.txt; exit 1; }; echo "[audit] root 第 $i 次网络失败，重试"; sleep 5; done
    - grep -q "audit endpoint returned an error" audit-root.txt 2>/dev/null && echo "[audit] 警告：root 审计端点不可达，跳过（非漏洞判定）" || echo "[audit] root 完成"
    - (cd mcp-server && npm ci --ignore-scripts)
    - for i in 1 2 3; do (cd mcp-server && npm audit --audit-level=critical > ../audit-mcp.txt 2>&1) && break; grep -q "audit endpoint returned an error" audit-mcp.txt || { cat audit-mcp.txt; exit 1; }; echo "[audit] mcp 第 $i 次网络失败，重试"; sleep 5; done
    - grep -q "audit endpoint returned an error" audit-mcp.txt 2>/dev/null && echo "[audit] 警告：mcp 审计端点不可达，跳过（非漏洞判定）" || echo "[audit] mcp 完成"

license-check:
  stage: license
  script:
    - test -f LICENSE || { echo "LICENSE file missing"; exit 1; }
    - grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE || { echo "AGPL-3.0 header not found"; exit 1; }
    - echo "AGPL-3.0 license verified"

# 手动发布 actspan-mcp：由 vX.Y.Z tag 触发，需在项目里配置 NPM_TOKEN（Automation 类型）。
publish-npm:
  stage: release
  timeout: 15m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  script:
    - test -n "$NPM_TOKEN" || { echo "NPM_TOKEN 未配置，无法发布"; exit 1; }
    - cd mcp-server
    - node -e "const v=require('./package.json').version; if ('v'+v !== process.env.CI_COMMIT_TAG) { console.error('版本不一致：package.json='+v+' tag='+process.env.CI_COMMIT_TAG); process.exit(1); }"
    - npm ci
    - npm test
    - npm run check:docs
    - npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
    - npm publish
